<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Sideline</title>
  <desc id="d">Sideline: a friend for the match, in your ear. An MCP server for live sport by voice.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#0d2547"/>
      <stop offset=".55" stop-color="#071428"/>
      <stop offset="1" stop-color="#030812"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bff3ff"/>
      <stop offset=".35" stop-color="#22c6ff"/>
      <stop offset="1" stop-color="#22c6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#22c6ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#22c6ff"/>
      <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
    </linearGradient>
    <style>
      .ring{fill:none;stroke:#3fd0ff}
      .spin{transform-origin:250px 180px;animation:spin 18s linear infinite}
      .spin2{transform-origin:250px 180px;animation:spin 26s linear infinite reverse}
      .pulse{transform-origin:250px 180px;animation:pulse 3.2s ease-in-out infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.08);opacity:1}}
      @media (prefers-reduced-motion: reduce){.spin,.spin2,.pulse{animation:none}}
    </style>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <g opacity=".35" fill="#9fdcff">
    <circle cx="90" cy="60" r="1.2"/><circle cx="420" cy="40" r="1"/><circle cx="610" cy="300" r="1.3"/>
    <circle cx="980" cy="70" r="1"/><circle cx="1180" cy="290" r="1.2"/><circle cx="760" cy="120" r=".9"/>
    <circle cx="140" cy="300" r="1"/><circle cx="1220" cy="140" r="1"/>
  </g>
  <!-- the eye -->
  <circle cx="250" cy="180" r="118" class="ring" stroke-opacity=".18" stroke-width="1" stroke-dasharray="2 7"/>
  <g class="spin2"><path d="M 250 78 A 102 102 0 0 1 345 140" class="ring" stroke-opacity=".55" stroke-width="2"/>
    <path d="M 160 236 A 102 102 0 0 1 150 160" class="ring" stroke-opacity=".35" stroke-width="2"/></g>
  <g class="spin"><path d="M 180 120 A 88 88 0 0 1 330 128" class="ring" stroke-opacity=".4" stroke-width="1.5"/>
    <path d="M 330 230 A 88 88 0 0 1 220 262" class="ring" stroke-opacity=".6" stroke-width="2"/></g>
  <circle cx="250" cy="180" r="66" class="ring" stroke-opacity=".75" stroke-width="2"/>
  <circle cx="250" cy="180" r="34" fill="url(#core)" class="pulse"/>
  <circle cx="250" cy="180" r="7" fill="#e9fbff"/>
  <!-- words -->
  <text x="430" y="150" fill="#ffffff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="700" letter-spacing="2">Sideline</text>
  <text x="434" y="200" fill="#bfe6ff" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="400">A friend for the match, in your ear.</text>
  <text x="434" y="240" fill="#7fa6c8" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19">An MCP server for live sport by voice · built first for people who cannot see the screen</text>
  <!-- the score strip -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" fill="#cfe9ff">
    <text x="434" y="296" font-size="16" letter-spacing="3">LYON</text>
    <text x="506" y="298" font-size="24" fill="#ffffff">3 – 2</text>
    <text x="604" y="296" font-size="16" letter-spacing="3">CRYSTAL PALACE</text>
    <text x="812" y="296" font-size="13" fill="#5ec8ff" letter-spacing="2">FOOTBALL · FT · THU, OCT 15, 2026</text>
  </g>
  <rect x="434" y="314" width="760" height="2" fill="url(#bar)" opacity=".8"/>
  <g fill="#e8f6ff"><rect x="480" y="309" width="2" height="12"/><rect x="690" y="309" width="2" height="12"/>
    <rect x="745" y="309" width="2" height="12"/><rect x="1010" y="309" width="2" height="12"/><rect x="1060" y="309" width="2" height="12"/></g>
</svg>
