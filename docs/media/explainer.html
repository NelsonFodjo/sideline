}

}

  // 1. ask
  op(g1, Math.min(P(t, 0, .4), 1 - P(t, 3.5, 4.0, eio)));

  a2a.set(P(t, 4.8, 5.4));
  op(bed, P(t, 4.4, 4.9));
  a2b.set(P(t, 5.9, 6.3));
  transcript.set(P(t, 6.3, 7.3, lin));

  // 3. handshake
  op(g3, Math.min(P(t, 9.1, 9.5), 1 - P(t, 14.6, 15.0, eio)));
  op(hdr, P(t, 9.4, 9.9));
  const rowT = [9.9, 10.8, 11.8, 12.7, 13.6];
  rows.forEach((r, i) => {
    r.arr.set(P(t, rowT[i], rowT[i] + .6, eio));
    op(r.lbl, P(t, rowT[i] + .2, rowT[i] + .6));
    op(r.g, i === 4 ? .55 : 1);
  });

  // host
  op(host, Math.min(P(t, 15.0, 15.6), 1 - P(t, 27.0, 27.5, eio)));
  mv(host, L(-30, 0, P(t, 15.0, 15.7)), 0);

  // 4. tool choice
  op(g4, Math.min(P(t, 15.2, 15.5), 1 - P(t, 22.0, 22.5, eio)));
  const beamY = L(70, target.y, P(t, 16.3, 18.4, eio));
  beam.setAttribute('y1', beamY); beam.setAttribute('y2', beamY);
  op(beam, W(t, 16.2, 18.8, .3));
  const chosen = P(t, 18.4, 18.8);
  tools.forEach((d, k) => {
    const appear = P(t, 15.4 + k * .03, 15.8 + k * .03);
    const scan = t > 16.2 && t < 18.8 ? cl(1 - Math.abs(d.y - beamY) / 44) : 0;
    const isT = d === target;
    op(d.g, appear * (isT ? 1 : L(1, .25, chosen)));
    if (d.box) {
      const hi = isT ? Math.max(scan, chosen) : scan;
      d.box.setAttribute('stroke', mix(C.soft, C.cyan, hi));
      d.box.setAttribute('stroke-opacity', L(.45, 1, hi));
      d.box.setAttribute('fill', isT ? `rgba(25,198,244,${(.06 + .16 * chosen).toFixed(3)})` : 'rgba(138,164,200,.06)');
      d.txt.setAttribute('fill', mix(C.soft, C.ink, hi));

  op(descG, P(t, 18.5, 18.8));
  desc.set(P(t, 18.6, 19.4, lin));
  op(nova, P(t, 19.7, 20.2));

  arrow5.set(P(t, 22.4, 23.2));

  op(split, 1 - P(t, 46.0, 46.4));
  op(bub, Math.min(P(t, 45.2, 45.7), 1 - P(t, 48.0, 48.4)));
  const n = words.length;
  words.forEach((w, i) => {
    const at = 46.1 + i * (1.8 / n);
    const said = P(t, at, at + .12), cur = W(t, at, at + 1.8 / n + .1, .1);
    w.setAttribute('fill', t < 46.0 ? C.ink : cur > .01 ? mix(C.ink, C.cyan, cur) : mix(C.soft, C.ink, said));
  });
  op(json, Math.min(P(t, 45.3, 45.8), 1 - P(t, 48.0, 48.35)));
  const jsOut = P(t, 47.9, 48.5, eio);
  json.setAttribute('transform', `translate(${L(0, -430, jsOut)},${L(0, -66, jsOut)}) scale(${L(1, 1.4, jsOut)})`);
  json.setAttribute('transform-origin', '1390 436');
  op(polly, W(t, 46.0, 48.4, .3));
  wave7(t, 1, 110);

  // screen
  op(screenG, Math.min(P(t, 48.1, 48.4), 1 - P(t, 57.8, 58.2, eio)));
  shots.forEach((sh, i) => {
    const next = shots[i + 1];
    let v = P(t, sh.at, sh.at + sh.fade, eio);
    if (next && t > next.at + next.fade) v = 0;
    op(sh.g, v);
  });
  // Dev log: slide the screen left to make room for labels, then zoom into the log panel
  const dl = Math.min(P(t, 50.6, 51.2, eio), 1 - P(t, 54.1, 54.6, eio));
  screenG.setAttribute('transform', `translate(${L(0, -280, dl).toFixed(1)},0)`);
  const z = L(1, 1.85, P(t, 51.3, 52.3, eio)), pan = L(0, -250, P(t, 52.6, 54.0, eio));
  devShot.img.setAttribute('transform', `translate(1479,${(60 + pan).toFixed(1)}) scale(${z.toFixed(4)}) translate(-1479,-60)`);
  op(g8, Math.min(P(t, 51.0, 51.4), 1 - P(t, 54.0, 54.4, eio)));
  g8items.forEach((e, i) => op(e, P(t, 51.4 + i * .3, 51.8 + i * .3)));

  // 9. any sport
  op(g9, Math.min(P(t, 54.4, 54.8), 1 - P(t, 57.8, 58.2, eio)));
  const fF = P(t, 56.9, 57.2);
  op(sportF, fF); op(sportB, 1 - fF);

  // 10. hold
  op(g10, P(t, 58.1, 58.7));

  captions.forEach(c => op(c.el, W(t, c.a, c.b, .3)));
  strip.forEach(p => {
    const lit = Math.max(...p.wins.map(([a, b]) => W(t, a, b, .35)));
    p.pill.setAttribute('stroke', mix(C.soft, C.ink, lit));
    p.pill.setAttribute('stroke-opacity', L(.35, 1, lit));
    p.pill.setAttribute('fill', `rgba(234,244,251,${(.12 * lit).toFixed(3)})`);
    p.label.setAttribute('fill', mix('#4d5f78', C.ink, lit));
    op(p.note, L(.45, 1, lit));
  });
}

/* ---------- reduced motion: hold each scene still for its duration ---------- */
const HOLDS = [[0, 4, 3.4], [4, 9, 8.4], [9, 15, 14.4], [15, 22, 21.5], [22, 27, 26.5], [27, 33.2, 32.8], [33.2, 38.8, 38.5],
  [38.8, 44.5, 43.5], [44.5, 48.2, 47.95], [48.2, 49.4, 49.1], [49.4, 50.5, 50.3], [50.5, 54.5, 53.6], [54.5, 55.7, 55.4],
  [55.7, 56.9, 56.6], [56.9, 58, 57.6], [58, 60.01, 60]];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches || /[?&]reduced/.test(location.search);
const view = t => { if (!reduce) return t; const h = HOLDS.find(([a, b]) => t >= a && t < b); return h ? h[2] : DUR; };

/* ---------- playback ---------- */
const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
let t = 0, playing = true, last = null;
const LOOP = !/[?&]once/.test(location.search);       // plays on a loop; ?once stops at the end
const hashT = location.hash.match(/t=([\d.]+)/);
if (hashT) { t = cl(parseFloat(hashT[1]), 0, DUR); playing = false; }
function ui() { playBtn.textContent = playing ? 'Pause' : (t >= DUR ? 'Replay' : 'Play'); scrub.value = t; clock.textContent = t.toFixed(2) + ' s'; }
function frame(now) {
  if (playing) {
    if (last != null) t += (now - last) / 1000;
    if (t >= DUR) { if (LOOP) t = 0; else { t = DUR; playing = false; } }
  }
  last = now;
  render(view(t)); ui();
  requestAnimationFrame(frame);
}
playBtn.addEventListener('click', () => { if (t >= DUR) t = 0; playing = !playing; });
scrub.addEventListener('input', () => { t = parseFloat(scrub.value); playing = false; });
addEventListener('keydown', e => {
  if (e.target === scrub && e.key.startsWith('Arrow')) return;
  if (e.code === 'Space') { e.preventDefault(); if (t >= DUR) t = 0; playing = !playing; }
  else if (e.key === 'r' || e.key === 'R') { t = 0; playing = true; }
  else if (e.key === 'ArrowRight') t = Math.min(DUR, t + .5);
  else if (e.key === 'ArrowLeft') t = Math.max(0, t - .5);
});
let idle;
function wake() { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 1600); }
document.body.classList.add('idle');
addEventListener('mousemove', wake);
window.__seek = x => { t = x; playing = false; render(view(t)); };
render(view(t));
requestAnimationFrame(frame);
})();
</script>
