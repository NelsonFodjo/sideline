name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The suite needs no network and no credentials. cryptography is
      # installed so the RS256 auth test runs rather than skips.
      - run: pip install cryptography
      - run: make test
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cfn-lint && cfn-lint deploy/sideline.yaml
      - run: bash -n scripts/deploy_aws.sh
