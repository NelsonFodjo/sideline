name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The suite needs no network, no credentials and no install: the server is
      # standard-library Python. (Node is preinstalled; it runs the browser-side
      # speech detector's tests.)
      - run: make test
