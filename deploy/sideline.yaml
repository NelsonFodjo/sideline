AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Sideline MCP server on AWS App Runner, with DynamoDB state, a scoped
  instance role (Bedrock, DynamoDB, optional Secrets Manager injection) and a
  catch-up latency alarm. Deploy with scripts/deploy_aws.sh, or see
  docs/DEPLOYMENT.md. The poller runs inside the server process, so no
  Lambda or EventBridge schedule is needed for this stack.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image to run, e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com/sideline:latest
  TableName:
    Type: String
    Default: sideline
  BedrockModelId:
    Type: String
    Default: anthropic.claude-3-5-haiku-20241022-v1:0
    Description: Model id or inference-profile id the account has access to (run scripts/verify_aws.py).
  BedrockEnabled:
    Type: String
    Default: "on"
    AllowedValues: ["on", "off"]
  FootballSecretArn:
    Type: String
    Default: ""
    Description: Optional Secrets Manager ARN of a secret whose string value is the football API key. It is injected into the container as the SIDELINE_FOOTBALL_KEY environment variable. Empty = use the bundled replay match.
  AuthMode:
    Type: String
    Default: "off"
    AllowedValues: ["off", "required"]
    Description: "'required' verifies bearer tokens; the three parameters below must then be set."
  AuthIssuer:
    Type: String
    Default: ""
  AuthResource:
    Type: String
    Default: ""
    Description: >-
      Canonical HTTPS URL of this server's MCP endpoint, exactly as in the
      Alexa+ add-on manifest, e.g. https://abc.us-east-1.awsapprunner.com/mcp.
      Published as `resource` in the protected-resource metadata.
  AuthAudience:
    Type: String
    Default: ""
    Description: Optional. Enforce this `aud` claim. Alexa's docs do not say tokens carry one.
  AuthScopes:
    Type: String
    Default: ""
    Description: Optional, space separated; published as scopes_supported.
  AuthJwksUrl:
    Type: String
    Default: ""

Conditions:
  HasSecret: !Not [!Equals [!Ref FootballSecretArn, ""]]
  AuthRequired: !Equals [!Ref AuthMode, "required"]
  HasAudience: !Not [!Equals [!Ref AuthAudience, ""]]
  HasScopes: !Not [!Equals [!Ref AuthScopes, ""]]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: tasks.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: sideline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource:
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt Table.Arn
              - !If
                - HasSecret
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref FootballSecretArn
                - !Ref AWS::NoValue

  EcrAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: build.apprunner.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  Service:
    Type: AWS::AppRunner::Service
    Properties:
      ServiceName: sideline
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt EcrAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8765"
            RuntimeEnvironmentVariables:
              - { Name: SIDELINE_STATE, Value: dynamo }
              - { Name: SIDELINE_TABLE, Value: !Ref Table }
              - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
              - { Name: SIDELINE_BEDROCK, Value: !Ref BedrockEnabled }
              - { Name: SIDELINE_BEDROCK_MODEL, Value: !Ref BedrockModelId }
              - { Name: SIDELINE_EMF, Value: "on" }
              - { Name: SIDELINE_AUTH, Value: !Ref AuthMode }
              - !If
                - AuthRequired
                - { Name: SIDELINE_AUTH_ISSUER, Value: !Ref AuthIssuer }
                - !Ref AWS::NoValue
              - !If
                - AuthRequired
                - { Name: SIDELINE_PUBLIC_URL, Value: !Ref AuthResource }
                - !Ref AWS::NoValue
              - !If
                - HasAudience
                - { Name: SIDELINE_AUTH_AUDIENCE, Value: !Ref AuthAudience }
                - !Ref AWS::NoValue
              - !If
                - HasScopes
                - { Name: SIDELINE_AUTH_SCOPES, Value: !Ref AuthScopes }
                - !Ref AWS::NoValue
              - !If
                - AuthRequired
                - { Name: SIDELINE_AUTH_JWKS_URL, Value: !Ref AuthJwksUrl }
                - !Ref AWS::NoValue
              - !If
                - HasSecret
                - { Name: SIDELINE_PROVIDER, Value: apifootball }
                - !Ref AWS::NoValue
            # Secrets Manager -> an ordinary environment variable inside the
            # container. The app only ever reads SIDELINE_FOOTBALL_KEY; the
            # value is never in the template, the console's plain-text
            # variables, or the image.
            RuntimeEnvironmentSecrets: !If
              - HasSecret
              - - { Name: SIDELINE_FOOTBALL_KEY, Value: !Ref FootballSecretArn }
              - !Ref AWS::NoValue
      InstanceConfiguration:
        Cpu: 0.25 vCPU
        Memory: 0.5 GB
        InstanceRoleArn: !GetAtt InstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 5

  CatchupLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: sideline-catchup-p95-high
      AlarmDescription: >-
        what_did_i_miss p95 above 2.5 s: model calls are about to hit the
        3 s ceiling and fall back to templates.
      Namespace: Sideline
      MetricName: ToolLatency
      Dimensions:
        - { Name: Tool, Value: what_did_i_miss }
      ExtendedStatistic: p95
      Period: 300
      EvaluationPeriods: 3
      Threshold: 2500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching

Outputs:
  ServiceUrl:
    Description: Give https://<this>/mcp to Alexa+ (set AuthResource to it if AuthMode=required).
    Value: !Sub https://${Service.ServiceUrl}
  TableName:
    Value: !Ref Table
