}

/* Play part 0 now, then each next part as its audio is ready. */
function playChain(parts,asked,first,spans,gen){
  return new Promise(function(done){
    var i=0;
    var preloaded={};
    for(var p=1;p<parts.length;p++){
      (function(idx){
        asked[idx].then(function(doc){
          if(gen===speakGen&&doc&&doc.audio){
            var a=new Audio("data:audio/mp3;base64,"+doc.audio);
            a.crossOrigin="anonymous";
            a.preload="auto";
            preloaded[idx]=a;
          }
        }).catch(function(){});
      })(p);
    }
    function next(doc){
      var base=parts[i].base;
      var el=preloaded[i]||new Audio("data:audio/mp3;base64,"+doc.audio);
      el.crossOrigin="anonymous";
      audioEl=el;
      try{
        srcNode=ctx.createMediaElementSource(el);
        srcNode.connect(outAn); outAn.connect(ctx.destination);
      }catch(e){ /* already connected, or unsupported: still audible */ }
      applyMarkDurations(spans,doc.marks,base);
      markTimers.forEach(clearTimeout);
      // One timer per word, from Polly's own millisecond offsets, placed in the whole text by this part's offset.
      markTimers=(doc.marks||[]).map(function(m){
        return setTimeout(function(){ reveal(spans,m.start+base); }, m.time);
      });
      var last=i===parts.length-1;
      el.onended=function(){
        if(gen!==speakGen) return;
        if(last){ finishSpeaking(spans,done); return; }
        i++;
        asked[i].then(function(d){ if(gen===speakGen) next(d); },
                      function(){                                  // the rest could not be made: say it with the browser's voice
                        if(gen!==speakGen) return;
                        browserSay(parts[i].text,spans,parts[i].base); done();
                      });
      };
      el.onerror=function(){ if(gen===speakGen) finishSpeaking(spans,done); };
      if(i===0) watchForBargeIn();
      el.play().catch(function(){ if(gen===speakGen) finishSpeaking(spans,done); });
    }
    next(first);
  });
}

var hasBoundary=false, activeUtterances=[];
function splitSentences(text){
  if(!text) return [];
  var re=/[.!?]+(?=\s+[A-Z0-9])/g;
  var parts=[], lastIdx=0, m;
  while((m=re.exec(text))!==null){
    var end=m.index+m[0].length;
    var words=text.slice(lastIdx,m.index).split(/\s+/);
    var lastWord=words.length?words[words.length-1]:"";
    var before=lastWord.toLowerCase().replace(/[^a-z]/g,"");
    if(m[0].charAt(0)==="." && before && (ABBR[before]||(before.length===1 && /^[a-zA-Z]+$/.test(lastWord)))) continue;
    var leadMatch=text.slice(end).match(/^\s*/);
    var leadLen=leadMatch?leadMatch[0].length:0;
    var sText=text.slice(lastIdx,end).trim();
    if(sText) parts.push({text:sText, base:lastIdx});
    lastIdx=end+leadLen;
  }
  if(lastIdx<text.length){
    var tail=text.slice(lastIdx).trim();
    if(tail) parts.push({text:tail, base:lastIdx});
  }
  return parts.length?parts:[{text:text, base:0}];
}

function browserSay(text,spans,base){
  base=base||0;
  hasBoundary=false;
  if(!("speechSynthesis" in window)){ timedReveal(spans); return; }
  if(speechSynthesis.speaking || speechSynthesis.pending){
    speechSynthesis.cancel();
  }
  activeUtterances=[];
  var vs=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)});
  var pref=vs.find(function(v){return /Online \(Natural\)|Google UK English Female|Google US English|Natural|Samantha|Amy|Brian|George/i.test(v.name)}) || vs.find(function(v){return v.localService;}) || vs[0];

  var sentences=splitSentences(text);
  if(!sentences.length) sentences=[{text:text,base:0}];

  watchForBargeIn();
  reveal(spans, base);

  sentences.forEach(function(sent,idx){
    var u=new SpeechSynthesisUtterance(sent.text);
    if(pref) u.voice=pref;
    u.rate=1.03;
    var isLast=(idx===sentences.length-1);
    var sentBase=base+sent.base;

    u.onboundary=function(e){
      if(!e.name||e.name==="word"){
        if(!hasBoundary){
          hasBoundary=true;
          markTimers.forEach(clearTimeout); markTimers=[];
        }
        reveal(spans,e.charIndex+sentBase);
      }
    };
    if(isLast){
      u.onend=function(){
        activeUtterances=[];
        markTimers.forEach(clearTimeout); markTimers=[];
        finishSpeaking(spans);
      };
      u.onerror=function(){
        activeUtterances=[];
        markTimers.forEach(clearTimeout); markTimers=[];
        finishSpeaking(spans);
      };
    }
    activeUtterances.push(u);
    speechSynthesis.speak(u);
  });

  // If native boundary events never arrive after 1.2s (unsupported engine),
  // fall back cleanly to estimated timing from current position.
  markTimers.push(setTimeout(function(){
    if(speaking && !hasBoundary){
      markTimers.forEach(clearTimeout); markTimers=[];
      timedReveal(spans,null,curIdx>=0?curIdx+1:0);
    }
  },1200));
}

var idleT=null, IDLE_MS=30000;
function wake(){ document.body.classList.remove("calm"); }
function armIdleClear(){
  clearTimeout(idleT); wake();
  // Persistent text: preserve response and match display permanently
  if(false){
    idleT=setTimeout(function(){
      if(speaking||paused||MODE==="thinking"||sawVoice) return;
      setQuiet(""); fadeSaid(false); hideMatch();      // all of it leaves; the next match answer brings it back
      var s=$("said"); if(s) s.textContent="";
      document.body.classList.add("calm");             // and the status line: only the eye remains
    },IDLE_MS);
  }
}

function finishSpeaking(spans,done){
  if(!speaking) return;
  speaking=false;
  markTimers.forEach(clearTimeout); markTimers=[];
  activeUtterances=[];
  hasBoundary=false;
  for(var k=0;k<flowTokens.length;k++){
    var item=flowTokens[k];
    if(!item.appended){
      item.appended=true;
      answer.appendChild(item.node);
      if(!item.isSpace) item.node.classList.add("in");
    }
  }
  spans.forEach(function(s){ s.classList.add("read"); s.classList.remove("now"); });
  moveBeam(null);
  answer.classList.add("settled");
  audioEl=null; setMode("idle");
  clearInterval(bargeTimer); stopRolling(); stopBargeSR();
  armIdleClear();
  if(done)done();
  // Clear any residual microphone echo before starting listening
  pcmChunks=[]; capText=""; sawVoice=false; lastVoice=0;
  // Hands-free: quick 50ms echo-clear before re-arming listening
  setTimeout(function(){ if(armed && !speaking) listen(); }, 50);
}

/* =============================================================== match */
var M={minute:0,told:null,events:[],home:"",away:"",score:null};
var shownScore=null;

function setScore(home,away){
  var h=$("sh"), a=$("sa");
  function put(el,v){
    if(el.textContent!==String(v)){
      el.textContent=v; el.classList.remove("bump"); void el.offsetWidth;
      if(shownScore) el.classList.add("bump");
    }
  }
  put(h,home); put(a,away);
  if(shownScore && (home+away)>(shownScore.home+shownScore.away) && !REDUCED) burst=1;
  shownScore={home:home,away:away};
}

var KIND={goal:"Goal",card:"Card",substitution:"Sub",var:"VAR"};
function showPills(events){
  var box=$("pills"); box.innerHTML="";
  // Major updates first: goals, red cards and VAR decisions, then the rest,
  // always the most recent four and always shown in match order.
  var major=function(e){ return e.kind==="goal"||e.kind==="var"||(e.kind==="card"&&e.colour==="red"); };
  var list=(events||[]).map(function(e,i){ return {e:e,i:i}; });
  list.sort(function(a,b){ return (major(b.e)-major(a.e)) || (b.i-a.i); });
  list=list.slice(0,4).sort(function(a,b){ return a.i-b.i; }).map(function(x){ return x.e; });
  list.forEach(function(e,i){
    var p=document.createElement("span");
    var cls=e.kind==="card"?(e.colour==="red"?"red":"yellow"):e.kind;
    p.className="pill "+cls+(e.kind==="card"?" card":"");
    var label=e.kind==="card"?(e.colour==="red"?"Red":"Yellow"):(KIND[e.kind]||e.kind);
    p.innerHTML='<span class="k"></span><span class="m"></span><span class="t"></span>';
    p.querySelector(".m").textContent=e.minute+"′";
    p.querySelector(".t").textContent=label+(e.player?" · "+e.player:"");
    box.appendChild(p);
    setTimeout(function(){ p.classList.add("in"); }, REDUCED?0:140+i*110);
  });
}

function hideMatch(){
  $("match").classList.remove("on");
  $("pills").innerHTML="";
  placeText();
}

function paint(){
  placeText();
  if(!M.home && !M.score && !(M.events&&M.events.length)) return;
  $("match").classList.add("on");
  $("teamh").textContent=M.home;
  $("teama").textContent=M.away;
  if(M.score) setScore(M.score.home,M.score.away);
  $("clock").textContent=M.minute+"′";
  var pc=function(m){return Math.max(0,Math.min(100,m/90*100))+"%"};
  $("played").style.width=pc(M.minute);
  $("nowdot").style.left=pc(M.minute); $("nowdot").classList.add("on");
  var have={};
  document.querySelectorAll(".bar .tick").forEach(function(n){
    have[n.dataset.k]=1;
  });
  document.querySelectorAll(".bar .tick").forEach(function(n){n.remove()});
  M.events.forEach(function(e){
    var t=document.createElement("div");
    t.className="tick"+(e.kind==="goal"?" goal":"");
    t.dataset.k=e.id||(e.minute+e.kind);
    if(have[t.dataset.k]) t.style.animation="none";
    t.style.left=pc(e.minute); $("bar").appendChild(t);
  });
  var tm=$("toldmark");
  if(M.told!=null){tm.classList.add("on");tm.style.left=pc(M.told);}
  var g=$("gap");
  if(M.told!=null&&M.minute>M.told+1){
    g.style.left=pc(M.told);
    g.style.width=((M.minute-M.told)/90*100)+"%"; g.style.opacity="1";
  }else g.style.opacity="0";
}

function renderAgentAnswer(result, t0){
  // Said "gamma osaka", meant "Gamba Osaka": show what we acted on.
  if(result.understood) showSaid(result.understood);
  var dot=$("dot"); dot.className="dot ok";
  void dot.offsetWidth; dot.classList.add("ping");
  var names=(result.tool_results||[]).map(function(item){return item.name});
  $("tool").textContent=names.length?names.join(" · "):"conversation";
  var viaText = "Nova";
  if(result.generated_by==="swarm-fast"){
    var count = (result.agents_used && result.agents_used.length) || 8;
    viaText = "Swarm (" + count + " Agents)";
  }
  else if(result.generated_by==="fast-path" || result.generated_by==="bedrock-fast") viaText="Fast-Path";
  else if(result.generated_by==="nova-fast") viaText="Nova-Fast";
  else if((result.model && result.model.indexOf("claude")!==-1) || result.generated_by==="claude") viaText="Claude";
  else if(result.model && result.model.indexOf("pro")!==-1) viaText="Nova Pro";
  $("via").textContent=viaText;
  $("via").className=(result.generated_by==="swarm-fast"||result.generated_by==="fast-path"||result.generated_by==="nova-fast"||result.generated_by==="bedrock-fast")?"via fast":"via bedrock";
  if(t0){
    var roundtripMs = Math.round(performance.now() - t0);
    $("ms").textContent = roundtripMs + "ms · <150ms";
  }
  // The teams and score belong to the topic: shown only when this answer carried match data.
  // No tool, or a tool that declined (nothing found, the feed refused), and they go.
  var aboutMatch=(result.tool_results||[]).some(function(i){
    var sc=i.structured||{}; return !!(sc.home||sc.score||(sc.events&&sc.events.length));
  });
  if(aboutMatch){ (result.tool_results||[]).forEach(applyToolResult); paint(); }
  else hideMatch();
  var spoken=result.text||"I couldn't get an answer.";
  if(paused) pendingAnswer=spoken;      // already told to the server: keep it, say it on resume
  else say(spoken,false);
}

/* ================================================================ ask */
var chatAbort=null;
async function ask(text){
  var t0=performance.now(); clearTimeout(idleT); wake();
  setMode("thinking");
  if(chatAbort){ try{chatAbort.abort()}catch(e){} }
  chatAbort=new AbortController();
  try{
    var response=await fetch(BASE+"/agent/chat",{method:"POST",
      headers:{"Content-Type":"application/json"},
      signal:chatAbort.signal,
      body:JSON.stringify({text:text,
        tz_offset_minutes:-new Date().getTimezoneOffset(),
        tz_name:(function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||undefined; }catch(e){ return undefined; } })(),
        interrupted:takeCut()})});
    if(!response.ok) throw new Error("agent unavailable");
    var result=await response.json();
    renderAgentAnswer(result, t0);
  }catch(e){
    // There is no offline fallback: the answer comes from Nova and the live
    // feed, or the listener is told it did not.
    $("dot").className="dot err"; $("tool").textContent="no answer";
    $("via").textContent="unavailable"; $("via").className="via";
    say("I can't get an answer right now. Please try again shortly.");
  }
}

function applyToolResult(item){
  var sc=item.structured||{};
  if(sc.minute!=null)M.minute=sc.minute;
  if(sc.home){M.home=sc.home;M.away=sc.away;}
  if(sc.score)M.score=sc.score;
  if(sc.window){M.told=sc.window.from_minute;M.minute=sc.window.to_minute;}
  if(sc.events&&sc.events.length){M.events=sc.events;showPills(sc.events);}
  if(item.name==="what_did_i_miss")M.told=M.minute;
}

/* ============================================================== start */
async function connect(){
  try{
    var health=await fetch(BASE+"/health");
    if(!health.ok) throw new Error("health check failed");
    var init=await rpc("initialize",{protocolVersion:"2025-11-25",
      clientInfo:{name:"alexa-plus-simulator",version:"3"}});
    await rpc("notifications/initialized");
    var list=await rpc("tools/list");
    $("dot").className="dot ok";
    $("tool").textContent=init.result.serverInfo.name;
    $("ms").textContent=list.result.tools.length+" tools";
    $("via").textContent="spec "+init.result.protocolVersion;
    return true;
  }catch(e){
    $("dot").className="dot err"; $("tool").textContent="server not running";
    setQuiet("I can\u2019t reach the server right now.");
    return false;
  }
}

/* What the simulated Alexa+ says first. Every claim is something the server does and a test or a run backs:
   real matches only (no recorded data), the per-listener "last told" marker, the spoiler guard, barge-in. */
var INTRO="Hi, I\u2019m a simulated Alexa+, connected to Sideline: an MCP server for live sports. "
  +"I read real matches as they happen. I remember what you last heard, so just ask what did I miss. "
  +"I stay behind your TV, so I won\u2019t spoil a goal. And you can talk over me. Which game are we following?";

var introStarted=false;
$("begin").onclick=async function(){
  if(introStarted) return;
  introStarted=true;
  $("begin").disabled=true;
  try{ await openAudio(); }
  catch(e){
    $("gatenote").textContent="microphone blocked — allow it and reload";
    return;
  }
  $("gate").classList.add("gone");
  sizeCore(); armed=true;
  startPassiveTicker();
  var connPromise=connect();
  if(!caps.stt && !SR){
    setQuiet("This browser can’t turn speech into text. Try Chrome.");
    return;
  }
  say(INTRO);
  await connPromise;
};

/* Ask the server what it can do, so the gate can say so before anyone
   commits a microphone to it. */
(async function(){
  try{
    var r=await fetch(BASE+"/voice/capabilities");
    if(r.ok)caps=await r.json();
  }catch(e){}
  useBrowserSTT=!caps.stt && !!SR;
  var inb=useBrowserSTT?"browser (<15ms)":(caps.stt||"browser (<15ms)");
  var outb=(caps.tts&&caps.tts!=="browser")?(caps.tts+" "+(caps.voice||"")):"browser (<15ms)";
  $("stack").innerHTML="in <b>"+inb+"</b> · out <b>"+outb+"</b> · <b>8-Agent Swarm (<150ms)</b>";
  // Setup hints (credentials, providers) are for the developer, not the
  // listener: they go to the console, never onto the screen.
  if(!caps.stt||!caps.tts){
    try{ console.info("sideline voice:", caps.stt_hint||"", caps.tts_hint||""); }catch(e){}
  }
  if(!caps.stt && !SR){
    $("gatenote").textContent="this browser can’t turn speech into text — try Chrome";
  }
  if(caps.tts && caps.tts !== "browser"){
    speechParts(INTRO).forEach(function(p){ fetchSpeech(p.text); });
  }
})();

var passivePollTimer=null;
function startPassiveTicker(){
  if(passivePollTimer) return;
  passivePollTimer=setInterval(async function(){
    if(!armed || speaking || MODE==="thinking" || !M.home) return;
    try{
      var r=await fetch(BASE+"/agent/chat",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({text:"score for "+M.home,tz_offset_minutes:-new Date().getTimezoneOffset()})});
      if(!r.ok) return;
      var d=await r.json();
      if(d && d.tool_results && (d.tool_results||[]).some(function(i){ var sc=i.structured||{}; return !!(sc.home||sc.score||(sc.events&&sc.events.length)); })){
        d.tool_results.forEach(applyToolResult);
        paint();
      }
    }catch(e){}
  }, 45000);
}

/* ============================================================== subtitles / voice-only toggle */
var subBtn=$("subToggle"), subLabel=$("subLabel");
function applyVoiceOnly(voiceOnly){
  if(voiceOnly){
    document.body.classList.add("voice-only");
    if(subBtn){ subBtn.classList.add("voice-only"); }
    if(subLabel){ subLabel.textContent="Voice-Only"; }
  } else {
    document.body.classList.remove("voice-only");
    if(subBtn){ subBtn.classList.remove("voice-only"); }
    if(subLabel){ subLabel.textContent="Subtitles: ON"; }
  }
}

try {
  var savedVoiceOnly = localStorage.getItem("sideline_voice_only") === "true";
  applyVoiceOnly(savedVoiceOnly);
} catch(e){}

if(subBtn){
  subBtn.onclick=function(){
    var isVoiceOnly = !document.body.classList.contains("voice-only");
    applyVoiceOnly(isVoiceOnly);
    try { localStorage.setItem("sideline_voice_only", isVoiceOnly ? "true" : "false"); } catch(e){}
  };
}
})();
